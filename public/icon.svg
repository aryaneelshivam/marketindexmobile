<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="blueLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="50%" stop-color="#2997ff" />
      <stop offset="100%" stop-color="#30d158" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2997ff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0066cc" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#2997ff" stroke-opacity="0.2" stroke-width="3" />

  <!-- Subtle Coordinate Grid -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="80" y1="240" x2="432" y2="240" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="80" y1="320" x2="432" y2="320" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="80" y1="400" x2="432" y2="400" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />

  <!-- Volume / Index Telemetry Bars -->
  <rect x="110" y="310" width="34" height="90" rx="8" fill="url(#barGrad)" opacity="0.6" />
  <rect x="175" y="250" width="34" height="150" rx="8" fill="url(#barGrad)" opacity="0.75" />
  <rect x="240" y="280" width="34" height="120" rx="8" fill="url(#barGrad)" opacity="0.7" />
  <rect x="305" y="190" width="34" height="210" rx="8" fill="url(#barGrad)" opacity="0.85" />
  <rect x="370" y="140" width="34" height="260" rx="8" fill="url(#barGrad)" opacity="0.95" />

  <!-- Area under chart line -->
  <path d="M 110 320 Q 175 250 240 270 T 305 180 T 387 130 L 387 400 L 110 400 Z" fill="url(#glowGrad)" />

  <!-- Trend Line with Smooth Curve -->
  <path d="M 110 320 Q 175 250 240 270 T 305 180 T 387 130" fill="none" stroke="url(#blueLine)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Signal Node Indicator -->
  <circle cx="387" cy="130" r="14" fill="#30d158" />
  <circle cx="387" cy="130" r="24" fill="none" stroke="#30d158" stroke-width="4" opacity="0.6" />
</svg>
