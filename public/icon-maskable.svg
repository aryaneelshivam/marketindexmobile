<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueLineMask" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="50%" stop-color="#2997ff" />
      <stop offset="100%" stop-color="#30d158" />
    </linearGradient>
    <linearGradient id="glowGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2997ff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="barGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0066cc" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for maskable container -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Inner safe zone content scaled within 75% center (384px) -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Coordinate Grid -->
    <line x1="60" y1="160" x2="452" y2="160" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="6 6" />
    <line x1="60" y1="250" x2="452" y2="250" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="6 6" />
    <line x1="60" y1="340" x2="452" y2="340" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="6 6" />
    <line x1="60" y1="410" x2="452" y2="410" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3" />

    <!-- Volume / Index Telemetry Bars -->
    <rect x="90" y="320" width="38" height="90" rx="8" fill="url(#barGradMask)" opacity="0.6" />
    <rect x="165" y="260" width="38" height="150" rx="8" fill="url(#barGradMask)" opacity="0.75" />
    <rect x="240" y="290" width="38" height="120" rx="8" fill="url(#barGradMask)" opacity="0.7" />
    <rect x="315" y="200" width="38" height="210" rx="8" fill="url(#barGradMask)" opacity="0.85" />
    <rect x="390" y="140" width="38" height="270" rx="8" fill="url(#barGradMask)" opacity="0.95" />

    <!-- Area under chart line -->
    <path d="M 90 330 Q 165 260 240 280 T 315 190 T 409 130 L 409 410 L 90 410 Z" fill="url(#glowGradMask)" />

    <!-- Trend Line -->
    <path d="M 90 330 Q 165 260 240 280 T 315 190 T 409 130" fill="none" stroke="url(#blueLineMask)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Signal Node Indicator -->
    <circle cx="409" cy="130" r="16" fill="#30d158" />
    <circle cx="409" cy="130" r="28" fill="none" stroke="#30d158" stroke-width="5" opacity="0.6" />
  </g>
</svg>
